[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
# Scripts read the mock bStock list.
fs_permissions = [{ access = "read", path = "./script" }, { access = "read-write", path = "./deployments" }]

[fmt]
line_length = 120
